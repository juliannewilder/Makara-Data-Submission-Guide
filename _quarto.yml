project: 
  type: book

book: 
  page-navigation: true
  title: "Makara Data Submission Guide" 
  site-url: "https://juliannewilder.github.io/Makara-Data-Submission-Guide/" 
  repo-url: "https://github.com/juliannewilder/Makara-Data-Submission-Guide"
  repo-actions: [edit, source, issue]
  favicon: assets/favicon.ico
  downloads: [pdf, docx]
  search: true
  author:
    - name: Jeffrey Walker
      affiliations:
        - name: NOAA Fisheres
          department: Northeast Fisheries Science Center
    - name: Julianne Wilder
      affiliations:
        - name: NOAA Fisheries
          department: Northeast Fisheries Science Center
    - name: Genevieve Davis
      affiliations:
        - name: NOAA Fisheries
          department: Northeast Fisheries Science Center
  chapters:
    - index.qmd
    - content/1_General_Information.qmd
    - content/2_Document_History_and_Revisions.qmd
    - content/3_Contact_Information_for_the_Makara_Database_Support_Team.qmd
    - content/4_Tips_and_Recommendations.qmd
    - content/5_Data_Table_Template_Instructions.qmd
    - content/6_Primary_Data_Tables.qmd
    - content/7_Optional_Data_Tables.qmd
    - content/8_Reference_Tables_Maintained_by_NEFSC.qmd
    - content/9_Data_Type_Formatting_Instructions.qmd
    - content/10_Data_Table_Field_Definitions.qmd
    - content/11_Deployments_Table_Field_Definitions.qmd
    - content/12_Recordings_Table_Field_Definitions.qmd
    - content/13_Analyses_Table_Field_Definitions.qmd
    - content/14_Detections_Table_Field_Definitions.qmd
    - content/15_Devices_Table_Field_Definitions.qmd
    - content/16_Projects_Table_Field_Definitions.qmd
    - content/17_Sites_Table_Field_Definitions.qmd
    - content/18_Recording_Intervals_Table_Field_Definitions.qmd
    - content/19_Tracks_Table_Field_Definitions.qmd
    - content/20_Track_Positions_Table_Field_Definitions.qmd
    - content/21_Sensor_Dataset_Field_Definitions.qmd
    - content/22_Sensor_Values_Table_Field_Definitions.qmd
    - content/23_Frequently_Asked_Questions.qmd
    - content/24_Example_Scenarios.qmd

  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"
  
  sidebar:
    background: "#D9E3E4"
    logo: images/PAB_LOGO_FINAL_DARKBLUE.PNG
    favicon: images/PAB_LOGO_FINAL_DARKBLUE.PNG
    pinned: true
    align: center
    tools: 
      - icon: globe
        href: https://nmfs-opensci.github.io
        text: "NMFS Open Science"
    style: "docked"
    search: true
    collapse-level: 1

bibliography: [content/references.bib]

execute:
  echo: false
  code-overflow: wrap

format:
  titlepage-pdf:
    documentclass: scrbook
    classoption: ["oneside", "open=any"]
    titlepage: "plain"
    keep-tex: true
  docx:
    toc: true
    toc-depth: 2
    reference-doc: template.docx
    always_allow_html: true
  html:
    theme: [cosmo, assets/theme.scss] 
    toc: true
    toc-depth: 3

filters:
  - assets/include-files.lua
  - quarto

# Comment next 2 lines if the PDF is having trouble
metadata-files:
  - _frontmatter.yml
 
